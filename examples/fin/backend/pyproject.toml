[project]
name = "finally-app"
version = "0.1.0"
description = "FinAlly — AI trading workstation backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Antonio Pisani", email = "antonio.pisani@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "litellm>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "black>=25.1",
    "isort>=6.0",
    "flake8>=7.1",
    "flake8-pyproject>=1.2",
    "pylint>=3.3",
    "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finally_app"]

# --- tooling -------------------------------------------------------------
# Line length 119 everywhere, per the user preference profile.

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 119

[tool.flake8]
max-line-length = 119
# E203 disagrees with black on slice colons; W503 predates black's operator wrapping.
extend-ignore = ["E203", "W503"]
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.pylint.main]
ignore-paths = ["^(.*/)?(tests|scripts)/"]

[tool.pylint.format]
max-line-length = 119

[tool.pylint."messages control"]
# The design is modules-of-functions by choice (user profile), so the
# class-oriented defaults fight it rather than help.
disable = ["missing-module-docstring", "too-few-public-methods"]

[tool.mypy]
python_version = "3.12"
strict = true
# Tests and scripts stay out of strict mode, matching the profile's VS Code config.
exclude = ["^tests/", "^scripts/"]

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
